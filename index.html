<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google-site-verification" content="T63dn9YRv3pOagVinWrHZexLIFbX_aN7pfYjyOCz6fg" />
    <!--
      Single Page Apps for GitHub Pages — rafgraph decode (pairs with public/404.html)
      https://github.com/rafgraph/spa-github-pages (MIT)
      Rewrites a `?/<path>` redirect from the 404 page back into the real route via
      history.replaceState before vue-router initializes. Runs only when present, so a
      normal load of `/raziel-ledger/` is untouched.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <!--
      Self-hosted, subsetted Great Vibes — homepage hero text only (PRD §14).
      OFL-licensed (https://fonts.google.com/specimen/Great+Vibes). Subset to the 11
      glyphs in "Raziel Ledger" (~6 KB). Preloaded + same-origin to avoid the
      cross-origin fonts.googleapis.com -> fonts.gstatic.com DNS/TLS chain.
    -->
    <link rel="preload" href="%BASE_URL%fonts/great-vibes-subset.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face {
        font-family: 'Great Vibes';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('%BASE_URL%fonts/great-vibes-subset.woff2') format('woff2');
      }
    </style>
    <title>Raziel Ledger - Granblue Fantasy Calculators</title>
    <meta name="title" content="Raziel Ledger - Granblue Fantasy Calculators">
    <meta name="description" content="Eternals and Evokers material trackers/calculators for Granblue Fantasy (GBF)">
    <link rel="canonical" href="https://rene880.github.io/raziel-ledger/">

    <!-- Open Graph / social link previews (static: scrapers do not run JS) -->

    <meta property="og:url" content="https://rene880.github.io/raziel-ledger/">
    <meta property="og:title" content="Raziel Ledger — Granblue Fantasy Calculators">
    <meta property="og:description" content="Eternals and Evokers material trackers/calculators for Granblue Fantasy (GBF).">
    <meta property="og:image" content="https://rene880.github.io/raziel-ledger/img/og-preview.png">

    <meta name="twitter:image" content="https://rene880.github.io/raziel-ledger/img/og-preview.png">
  </head>
