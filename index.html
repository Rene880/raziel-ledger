<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google-site-verification" content="T63dn9YRv3pOagVinWrHZexLIFbX_aN7pfYjyOCz6fg" />
    <!--
      Single Page Apps for GitHub Pages — rafgraph decode (pairs with public/404.html)
      https://github.com/rafgraph/spa-github-pages (MIT)
      Rewrites a `?/<path>` redirect from the 404 page back into the real route via
      history.replaceState before vue-router initializes. Runs only when present, so a
      normal load of `/raziel-ledger/` is untouched.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <meta name="twitter:image" content="https://rene880.github.io/raziel-ledger/img/og-preview.png">
  </head>
